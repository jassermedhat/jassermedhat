<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end intelligent systems pipeline</title>
  <desc id="desc">A pipeline from sensing and data through models, software, and deployment to real-world impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#101128"/>
    </linearGradient>
    <linearGradient id="line" x1="110" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE2FF"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#45E6A8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="19" stroke="#4DE2FF" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M130 104H1070" stroke="url(#line)" stroke-width="2" stroke-opacity="0.65"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(54 50)">
      <rect width="172" height="108" rx="16" fill="#0C1A2C" stroke="#4DE2FF" stroke-opacity="0.55"/>
      <circle cx="86" cy="22" r="6" fill="#4DE2FF" filter="url(#glow)"/>
      <text x="86" y="59" text-anchor="middle" fill="#F4F8FF" font-size="17" font-weight="700">SENSE</text>
      <text x="86" y="82" text-anchor="middle" fill="#7890AD" font-size="12">sensors · images · data</text>
    </g>
    <g transform="translate(284 50)">
      <rect width="172" height="108" rx="16" fill="#0C1A2C" stroke="#66CFF6" stroke-opacity="0.52"/>
      <circle cx="86" cy="22" r="6" fill="#66CFF6" filter="url(#glow)"/>
      <text x="86" y="59" text-anchor="middle" fill="#F4F8FF" font-size="17" font-weight="700">ENGINEER</text>
      <text x="86" y="82" text-anchor="middle" fill="#7890AD" font-size="12">clean · label · features</text>
    </g>
    <g transform="translate(514 50)">
      <rect width="172" height="108" rx="16" fill="#11172D" stroke="#A78BFA" stroke-opacity="0.58"/>
      <circle cx="86" cy="22" r="6" fill="#A78BFA" filter="url(#glow)"/>
      <text x="86" y="59" text-anchor="middle" fill="#F4F8FF" font-size="17" font-weight="700">LEARN</text>
      <text x="86" y="82" text-anchor="middle" fill="#7890AD" font-size="12">train · evaluate · reason</text>
    </g>
    <g transform="translate(744 50)">
      <rect width="172" height="108" rx="16" fill="#101A2D" stroke="#8EA2FA" stroke-opacity="0.52"/>
      <circle cx="86" cy="22" r="6" fill="#8EA2FA" filter="url(#glow)"/>
      <text x="86" y="59" text-anchor="middle" fill="#F4F8FF" font-size="17" font-weight="700">BUILD</text>
      <text x="86" y="82" text-anchor="middle" fill="#7890AD" font-size="12">APIs · apps · robotics</text>
    </g>
    <g transform="translate(974 50)">
      <rect width="172" height="108" rx="16" fill="#0D1D28" stroke="#45E6A8" stroke-opacity="0.58"/>
      <circle cx="86" cy="22" r="6" fill="#45E6A8" filter="url(#glow)"/>
      <text x="86" y="59" text-anchor="middle" fill="#F4F8FF" font-size="17" font-weight="700">IMPACT</text>
      <text x="86" y="82" text-anchor="middle" fill="#7890AD" font-size="12">deploy · monitor · improve</text>
    </g>
  </g>
</svg>
