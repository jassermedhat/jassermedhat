      <text x="72" y="207" fill="#6F86A4" font-weight="700" letter-spacing="1.4">EXPLORING</text>
      <text x="265" y="207" fill="#D8E4F3">Embodied AI · VLA architectures · multimodal autonomous systems</text>

      <text x="72" y="247" fill="#6F86A4" font-weight="700" letter-spacing="1.4">OUTPUT</text>
      <text x="265" y="247" fill="#D8E4F3">Models, datasets, APIs, applications, robots — and occasionally bugs</text>
    </g>

    <text x="1124" y="273" text-anchor="end" fill="#526983" font-size="11">MANUAL UPDATE · AUG 2026</text>
